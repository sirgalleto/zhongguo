<title>China Trip 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: phone app shell. Compact sticky top bar, one scrolling panel per tab, fixed bottom tab bar.
   Look: China rail ticket. Pale ticket-blue paper, navy ink, one vermilion "stamp" that marks today. */
:root{
  --paper:#edf2f5; --card:#ffffff; --ink:#14233a; --muted:#59697e; --line:#d2dce5; --ticket:#dce8f0;
  --stamp:#c4361f; --stamp-soft:#f7e1db; --ok:#2c7656; --ok-soft:#dcefe5; --warn:#9a5a08; --warn-soft:#f8ead2;
  --c-sh:#2f5d8a; --c-bj:#9a3b2e; --c-xa:#9a6a22; --c-cd:#3b7a4b; --c-cq:#76488a; --c-sz:#1c7a82; --c-gz:#a9512f;
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:"Instrument Sans",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1621; --card:#162131; --ink:#e5ecf4; --muted:#93a2b6; --line:#28374b; --ticket:#1b2a3c;
  --stamp:#f0705a; --stamp-soft:#3a201c; --ok:#62c49a; --ok-soft:#173327; --warn:#eab463; --warn-soft:#3a2b14;
  --c-sh:#7fa9d6; --c-bj:#e08a7c; --c-xa:#d9a95c; --c-cd:#7dc08e; --c-cq:#c195d6; --c-sz:#64c3ca; --c-gz:#e79a77;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e1621; --card:#162131; --ink:#e5ecf4; --muted:#93a2b6; --line:#28374b; --ticket:#1b2a3c;
  --stamp:#f0705a; --stamp-soft:#3a201c; --ok:#62c49a; --ok-soft:#173327; --warn:#eab463; --warn-soft:#3a2b14;
  --c-sh:#7fa9d6; --c-bj:#e08a7c; --c-xa:#d9a95c; --c-cd:#7dc08e; --c-cq:#c195d6; --c-sz:#64c3ca; --c-gz:#e79a77;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px;border-radius:6px}
.zh{font-family:var(--f-display)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-size:16px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:13px}
.status{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--stamp-soft);color:var(--stamp);white-space:nowrap}

main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
section[role=tabpanel]{display:flex;flex-direction:column;gap:16px}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 0;font-weight:600}

/* Bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted)}
.tab .zh{font-size:18px;line-height:1.3;font-weight:600}
.tab small{font-size:11px;font-weight:600;letter-spacing:.02em}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true] .zh{color:var(--stamp)}

/* Ticket card */
.ticket{background:var(--ticket);border-radius:var(--r);position:relative;overflow:hidden}
.ticket-main{padding:18px 18px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:end}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big-zh{font-family:var(--f-display);font-weight:900;font-size:clamp(52px,16vw,76px);line-height:1;letter-spacing:.02em}
.big-py{font-size:15px;color:var(--muted);margin-top:6px}
.stamp{width:72px;height:72px;border:2.5px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;text-align:center;transform:rotate(-12deg);font-weight:700;line-height:1.1}
.stamp .zh{font-size:22px;font-weight:900;display:block}
.stamp small{font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.perf{height:0;border-top:2px dashed var(--line);margin:0 14px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper)}
.perf::before{left:-22px}.perf::after{right:-22px}
.ticket-foot{padding:12px 18px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px}
.kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kv .v{font-weight:600;font-size:14px;overflow-wrap:anywhere}

/* Route line */
.route{background:var(--card);border-radius:var(--r);padding:16px 10px 12px;border:1px solid var(--line)}
.route ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);position:relative}
.route ol::before{content:"";position:absolute;left:7%;right:7%;top:9px;height:2px;background:var(--line)}
.route li{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.route .dot{width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--cc);position:relative}
.route li.past .dot{background:var(--cc)}
.route li.now .dot{background:var(--stamp);border-color:var(--stamp);box-shadow:0 0 0 4px var(--stamp-soft)}
.route .zh{font-size:17px;font-weight:600}
.route small{font-size:10px;color:var(--muted);white-space:nowrap}

/* Day list */
.days{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.day{display:grid;grid-template-columns:64px 4px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{font-size:12px;color:var(--muted);line-height:1.25}
.day .d b{display:block;font-size:16px;color:var(--ink)}
.day .bar{align-self:stretch;border-radius:2px;background:var(--cc)}
.day .what{min-width:0}
.day .what b{font-weight:600}
.day .what span{display:block;font-size:12.5px;color:var(--muted)}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.move{border-color:var(--cc);color:var(--cc)}
.day.past{opacity:.5}
.day.today{background:var(--stamp-soft)}
.day.today .tag{background:var(--stamp);border-color:var(--stamp);color:var(--card)}

.sim{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.sim input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Stays */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.summary b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}
.stay{--cc:var(--muted)}
.stay .ticket-main{grid-template-columns:auto 1fr;align-items:center}
.stay .city-zh{font-family:var(--f-display);font-weight:900;font-size:34px;color:var(--cc);line-height:1}
.stay h3{margin:0;font-size:16px;line-height:1.3;text-wrap:balance}
.stay .when{font-size:13px;color:var(--muted)}
.stay.current{box-shadow:0 0 0 2px var(--stamp)}
.links{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 16px}
.links a{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:8px}
.copy{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;font-family:var(--f-mono);font-size:13px;font-weight:500;text-decoration:underline dotted;text-underline-offset:3px}
.note{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

/* Plan */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pday{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;scroll-margin-top:72px}
.pday header{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pday header .zh{font-size:26px;font-weight:900;color:var(--cc);line-height:1}
.pday header div{flex:1;min-width:0}
.pday header b{display:block;font-size:15px}
.pday header span{font-size:12.5px;color:var(--muted)}
.pday.today{box-shadow:0 0 0 2px var(--stamp)}
.pday.past{opacity:.6}
.pday ul{list-style:none;margin:0;padding:6px 0}
.pday li label{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 14px;align-items:start;cursor:pointer}
.pday li input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ok)}

.pday .transit{margin:0 14px 10px;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--ticket)}
.pday .tip{margin:0 14px 12px;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--stamp-soft);color:var(--ink)}
.pday .tip b{color:var(--stamp)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.confirmed{background:var(--ok-soft);color:var(--ok)}
.badge.tobook{background:var(--warn-soft);color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:4px;text-decoration:none}
.pday li .txt{display:block}
.pday li input:checked + span .txt{text-decoration:line-through;color:var(--muted)}
.pday .transit{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

/* Dictionary */
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.cat{display:flex;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cat h3{margin:0;padding:10px 14px;font-size:13px;font-weight:700;background:var(--ticket);display:flex;justify-content:space-between;align-items:baseline}
.cat h3 .zh{font-weight:600;color:var(--muted)}
.ph{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.cat h3 + .ph{border-top:0}
.ph .en{font-size:13px;color:var(--muted);grid-column:1}
.ph .hz{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.3;grid-column:1}
.ph .py{font-size:15px;grid-column:1;color:var(--ink)}
.ph .acts{grid-column:2;grid-row:1 / span 3;display:flex;flex-direction:column;gap:6px}
.ico{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;padding:0}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--muted);padding:24px}

/* Show-to-someone overlay */
.show{position:fixed;inset:0;z-index:20;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 20px;text-align:center}
.show .hz{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,13vw,96px);line-height:1.2;text-wrap:balance}
.show .py{font-size:20px;color:var(--muted)}
.show .en{font-size:15px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:30}

@media (prefers-reduced-motion:no-preference){
  .day.today,.pday.today{animation:pulse 1.6s ease-out 1}
  @keyframes pulse{from{box-shadow:0 0 0 6px var(--stamp-soft)}}
}
@media (max-width:380px){.summary b{font-size:17px}.day{grid-template-columns:54px 4px 1fr auto;gap:10px}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>China Trip</b><span>Oct 11 to Nov 4</span></div>
    <span class="status" id="status">…</span>
  </div>
</header>

<main>
  <section role="tabpanel" id="p-itinerary" aria-labelledby="t-itinerary"></section>
  <section role="tabpanel" id="p-stays" aria-labelledby="t-stays" hidden></section>
  <section role="tabpanel" id="p-plan" aria-labelledby="t-plan" hidden></section>
  <section role="tabpanel" id="p-dictionary" aria-labelledby="t-dictionary" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" id="t-itinerary" data-tab="itinerary" aria-controls="p-itinerary"><span class="zh">行程</span><small>Itinerary</small></button>
    <button class="tab" role="tab" id="t-stays" data-tab="stays" aria-controls="p-stays"><span class="zh">住宿</span><small>Accommodation</small></button>

    <button class="tab" role="tab" id="t-dictionary" data-tab="dictionary" aria-controls="p-dictionary"><span class="zh">词典</span><small>Dictionary</small></button>
  </div>
</nav>

<div class="show" id="show" hidden>
  <div class="hz" id="show-hz"></div>

</div>

const DAY=86400000;
const toUTC=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const keyOf=t=>new Date(t).toISOString().slice(0,10);
const localToday=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`};
const fmt=(s,o)=>new Date(toUTC(s)).toLocaleDateString('en-US',Object.assign({timeZone:'UTC'},o));
const short=s=>fmt(s,{month:'short',day:'numeric'});
const START='2026-10-11',END='2026-11-04';

const DAYS=[];
for(let t=toUTC(START);t<=toUTC(END);t+=DAY){
  const k=keyOf(t);
  const si=STAYS.findIndex(s=>k>=s.in&&k<s.out);
  const arriving=STAYS.findIndex(s=>s.in===k);
  let kind='stay',c=si>=0?STAYS[si].c:STAYS[STAYS.length-1].c,from=null;
  if(k===START)kind='arrive';
  else if(k===END)kind='depart';
  else if(arriving>0){kind='move';from=STAYS[arriving-1].c}
  DAYS.push({k,c,si,kind,from});
}

let sim=null;
const today=()=>sim||localToday();

function phase(){
  const t=today();
  if(t<START)return{when:'before',n:Math.round((toUTC(START)-toUTC(t))/DAY)};
  if(t>END)return{when:'after'};
  const idx=DAYS.findIndex(d=>d.k===t);
  return{when:'during',idx,day:DAYS[idx]};
}

function setStatus(){
  const p=phase(),s=$('#status');
  s.textContent=p.when==='before'?`Starts in ${p.n} day${p.n===1?'':'s'}`:p.when==='after'?'Trip complete':`Day ${p.idx+1} of ${DAYS.length}`;
}

/* ---------- Itinerary ---------- */
function renderItinerary(){
  const p=phase();
  let stay,label,stampZh,stampEn,foot='';
  if(p.when==='before'){
    stay=STAYS[0];label=`First stop · ${fmt(START,{weekday:'long',month:'short',day:'numeric'})}`;
    stampZh='出发';stampEn=`in ${p.n}d`;
  }else if(p.when==='after'){
    stay=STAYS[STAYS.length-1];label='Last stop';stampZh='到达';stampEn='done';
  }else{
    const d=p.day;stay=d.si>=0?STAYS[d.si]:STAYS[STAYS.length-1];
    label=d.kind==='move'?`Travel day · from ${CITIES[d.from].en}`:d.kind==='depart'?'Departure day':`Today · ${fmt(d.k,{weekday:'long',month:'short',day:'numeric'})}`;
    stampZh='今天';stampEn='today';
  }
  const city=CITIES[stay.c];
  const nights=(toUTC(stay.out)-toUTC(stay.in))/DAY;
  let nightTxt=`${nights} nights`;
  if(p.when==='during'&&p.day.kind!=='depart'){const n=(toUTC(p.day.k)-toUTC(stay.in))/DAY+1;nightTxt=`Night ${n} of ${nights}`}
  const nextStay=STAYS[STAYS.indexOf(stay)+1];
  const nextTxt=p.when==='after'?'·':nextStay?`${short(stay.out)} → ${CITIES[nextStay.c].en}`:`${short(END)} → beach`;
  const tr=p.when==='during'&&TRANSIT[p.day.k];
  const booked=p.when==='during'&&PLAN[p.day.k]?PLAN[p.day.k].i.map(norm).filter(x=>x.status):[];
  const transit=(tr?`<div class="note"><b>Getting there:</b> ${esc(tr.text)}${tr.status?`<span class="meta">${badge(tr.status)}</span>`:''}</div>`:'')
    +(booked.length?`<div class="note"><b>Bookings today</b>${booked.map(x=>`<div style="margin-top:6px">${esc(x.text)}${meta(x)}</div>`).join('')}</div>`:'');

  const cIdx=STAYS.indexOf(stay);
  const route=STAYS.map((s,i)=>{
    let cls='';
    if(p.when==='after'||(p.when==='during'&&i<cIdx))cls='past';
    if(p.when==='during'&&i===cIdx)cls='now';
    return `<li class="${cls}" style="--cc:var(--c-${s.c})"><span class="dot"></span><span class="zh">${CITIES[s.c].zh}</span><small>${short(s.in)}</small></li>`;
  }).join('');

  const t=today();
  const rows=DAYS.map(d=>{
    const c=CITIES[d.c];
    const isT=d.k===t, past=d.k<t;
    let what=`<b>${c.en}</b>`, sub=PLAN[d.k]?PLAN[d.k].t:'', tag='';
    const nc=PLAN[d.k]?PLAN[d.k].i.map(norm).filter(x=>x.status==='confirmed').length:0;
    if(nc)sub+=` · ${nc} confirmed`;
    if(d.kind==='arrive'){tag='<span class="tag move">Arrive</span>'}
    else if(d.kind==='move'){what=`<b>${CITIES[d.from].en} → ${c.en}</b>`;tag='<span class="tag move">Train</span>'}
    else if(d.kind==='depart'){what=`<b>Leave ${c.en}</b>`;tag='<span class="tag move">Depart</span>'}
    if(isT)tag='<span class="tag">Today</span>';
    return `<div class="day${isT?' today':''}${past?' past':''}" style="--cc:var(--c-${d.c})" ${isT?'id="today-row"':''}>
      <div class="d mono">${fmt(d.k,{weekday:'short'})}<b>${fmt(d.k,{month:'short',day:'numeric'}).replace(' ',' ')}</b></div>
      <span class="bar"></span>
      <div class="what">${what}<span>${esc(sub)}</span></div>${tag}</div>`;
  }).join('');

  $('#p-itinerary').innerHTML=`
    <article class="ticket" style="--cc:var(--c-${stay.c})">
      <div class="ticket-main">
        <div><div class="eyebrow">${esc(label)}</div>
          <div class="big-zh">${city.zh}</div><div class="big-py">${city.py} · ${city.en}</div></div>
        <div class="stamp"><span><span class="zh">${stampZh}</span><small>${stampEn}</small></span></div>
      </div>
      <div class="perf"></div>
      <div class="ticket-foot">
        <div class="kv"><div class="k">Staying at</div><div class="v">${esc(stay.name.split(' (')[0])}</div></div>
        <div class="kv"><div class="k">Nights</div><div class="v">${nightTxt}</div></div>
        <div class="kv"><div class="k">Next move</div><div class="v">${nextTxt}</div></div>
      </div>
    </article>
    ${transit}
    <div class="route" aria-label="Route"><ol>${route}</ol></div>
    <h2>Day by day</h2>
    <div class="days">${rows}</div>
    <div class="sim"><label for="simdate">Preview a date</label><input type="date" id="simdate" min="2026-10-01" max="2026-11-10" value="${sim||''}"><button class="btn" id="simreset">Use real today</button></div>`;
  $('#simdate').onchange=e=>{sim=e.target.value||null;renderAll()};
  $('#simreset').onclick=()=>{sim=null;renderAll()};
}

  const cards=STAYS.map(s=>{
    const c=CITIES[s.c],n=(toUTC(s.out)-toUTC(s.in))/DAY,cur=t>=s.in&&t<s.out;
    const q=encodeURIComponent(s.name.split(' (')[0]+' '+c.en);
    return `<article class="ticket stay${cur?' current':''}" style="--cc:var(--c-${s.c})">
      <div class="ticket-main">

        <div style="min-width:0"><div class="when">${fmt(s.in,{weekday:'short',month:'short',day:'numeric'})} → ${fmt(s.out,{weekday:'short',month:'short',day:'numeric'})} · ${n} night${n>1?'s':''}${cur?' · <b style="color:var(--stamp)">Now</b>':''}</div>

      <div class="perf"></div>
      <div class="ticket-foot">

        <div class="kv"><div class="k">Paid</div><div class="v mono">${s.price}</div></div>
        <div class="kv"><div class="k">Area</div><div class="v">${esc(s.area)}</div></div>
        <div class="kv"><div class="k">Status</div><div class="v">${badge('confirmed')}</div></div>
        <div class="kv"><div class="k">Booking no.</div><div class="v"><button class="copy" data-copy="${s.no}" aria-label="Copy booking number">${s.no}</button></div></div>
      </div>
      <div class="links">

        <a href="https://maps.apple.com/?q=${q}" target="_blank" rel="noopener">Apple Maps</a>
      </div>
    </article>`;
  }).join('');
  $('#p-stays').innerHTML=`
    <div class="summary">
      <div><b>7</b><span>hotels</span></div>
      <div><b>24</b><span>nights</span></div>
      <div><b class="mono" style="font-size:15px;line-height:1.35">REMOVED<br>REMOVED</b><span>total paid</span></div>
    </div>
    <div class="note">Check-in at every hotel needs your passport. For taxis, open the booking in the Trip.com app and use the Chinese address card, drivers read that faster than any map pin.</div>
    ${cards}`;
}

/* ---------- Plan ---------- */
let planFilter=store.get('cn-plan-filter','all');
function renderPlan(){
  const done=store.get('cn-plan-done',{});
  const t=today();
  const chips=['all',...STAYS.map(s=>s.c)].map(c=>`<button class="chip" data-f="${c}" aria-pressed="${planFilter===c}">${c==='all'?'All days':CITIES[c].en}</button>`).join('');
  const cards=DAYS.filter(d=>planFilter==='all'||d.c===planFilter||(d.from&&d.from===planFilter)).map((d,i)=>{
    const p=PLAN[d.k]||{t:'',i:[]};const c=CITIES[d.c];
    const n=DAYS.indexOf(d)+1;
    const items=p.i.map(norm).map(it=>{const id=`${d.k}-${hash(it.text)}`;return `<li><label><input type="checkbox" id="pc-${id}" data-id="${id}" ${done[id]?'checked':''}><span><span class="txt">${esc(it.text)}</span>${meta(it)}</span></label></li>`}).join('');
    return `<article class="pday${d.k===t?' today':''}${d.k<t?' past':''}" style="--cc:var(--c-${d.c})" id="day-${d.k}">
      <header><span class="zh">${c.zh}</span><div><b>${esc(p.t)}</b><span>Day ${n} · ${fmt(d.k,{weekday:'long',month:'short',day:'numeric'})}</span></div>${d.k===t?'<span class="tag" style="background:var(--stamp);border-color:var(--stamp);color:var(--card)">Today</span>':''}</header>
      <ul>${items}</ul>
      ${TRANSIT[d.k]&&d.kind!=='arrive'?`<div class="transit"><span>${esc(TRANSIT[d.k].text)}</span>${badge(TRANSIT[d.k].status)}</div>`:''}
      ${p.tip?`<div class="tip"><b>Tip</b> ${esc(p.tip)}</div>`:''}
    </article>`;
  }).join('');
  $('#p-plan').innerHTML=`<div class="chips" role="group" aria-label="Filter by city">${chips}</div>${cards}`;
  $('#p-plan').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{planFilter=b.dataset.f;store.set('cn-plan-filter',planFilter);renderPlan()});
  $('#p-plan').querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{const d=store.get('cn-plan-done',{});if(cb.checked)d[cb.dataset.id]=1;else delete d[cb.dataset.id];store.set('cn-plan-done',d)});
}

  renderDict();
}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('Audio is not available here')}}
let showing=null;
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-say]');if(s){say(s.dataset.say);return}
  const sh=e.target.closest('[data-show]');
  if(sh){showing=JSON.parse(decodeURIComponent(sh.dataset.show));$('#show-en').textContent=showing[0];$('#show-hz').textContent=showing[1];$('#show-py').textContent=showing[2];$('#show').hidden=false;return}
  const cp=e.target.closest('[data-copy]');
  if(cp){e.preventDefault();const v=cp.dataset.copy;try{navigator.clipboard.writeText(v).then(()=>toast('Booking number copied'),()=>selectText(cp))}catch(err){selectText(cp)}}
});
function selectText(el){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected, copy it from the menu')}catch(e){}}
$('#show-close').onclick=()=>{$('#show').hidden=true};
$('#show-say').onclick=()=>showing&&say(showing[1]);
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#show').hidden=true});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

/* ---------- Tabs ---------- */
const TABS=['itinerary','stays','plan','dictionary'];
function go(tab,scroll){
  if(!TABS.includes(tab))tab='itinerary';
  TABS.forEach(t=>{$('#p-'+t).hidden=t!==tab;$('#t-'+t).setAttribute('aria-selected',t===tab)});
  store.set('cn-tab',tab);
  window.scrollTo(0,0);
  if(scroll&&tab==='plan'){const el=document.getElementById('day-'+today());if(el)el.scrollIntoView({block:'start'})}
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.tab,true));

function renderAll(){setStatus();renderItinerary();renderStays();renderPlan()}
renderAll();initDict();
const h=(location.hash||'').slice(1);
go(TABS.includes(h)?h:store.get('cn-tab','itinerary'),false);

/* Re-check the date when the app comes back to the foreground (e.g. next morning) */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sim)renderAll()});

/* Offline support when installed from its own host (ignored inside the claude.ai viewer) */
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{})}}catch(e){}
})();
</script>

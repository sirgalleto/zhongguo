<title>China Trip 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* Layout: phone app shell. Sticky top bar, one panel per tab, fixed bottom tab bar.
   Look: minimal, futurist, Chinese. Hairlines instead of cards, thin sans hanzi as the hero,
   mono for data, a square seal (印) for today. One accent at a time: today's city color via --accent. */
:root{
  --paper:#F3F4F6; --card:#FFFFFF; --ink:#0E1116; --muted:#687083; --line:#E1E4EA; --faint:#ECEEF2;
  --ok:#138A55; --ok-soft:#E3F4EA; --warn:#A86A00; --warn-soft:#FAF0DA;
  --c-sh:#2F6BFF; --c-bj:#E5322D; --c-xa:#D98A1C; --c-cd:#6FA312; --c-cq:#E0337A; --c-sz:#0E9FB2; --c-gz:#8B5CF6;
  --accent:var(--c-sh); --glow:none;
  --stamp:var(--accent); --stamp-soft:color-mix(in srgb,var(--accent) 9%,var(--card));
  --f-display:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Geist","Noto Sans SC",-apple-system,"PingFang SC",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#08090C; --card:#101218; --ink:#E8EAF0; --muted:#8A90A2; --line:#1F232D; --faint:#15181F;
  --ok:#4CD89A; --ok-soft:#0F2A1F; --warn:#F2B84B; --warn-soft:#2B220F;
  --c-sh:#5B8CFF; --c-bj:#FF5A4E; --c-xa:#F2A93B; --c-cd:#A6E04A; --c-cq:#FF5C9A; --c-sz:#3CCFE0; --c-gz:#A98BFF;
  --glow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#08090C; --card:#101218; --ink:#E8EAF0; --muted:#8A90A2; --line:#1F232D; --faint:#15181F;
  --ok:#4CD89A; --ok-soft:#0F2A1F; --warn:#F2B84B; --warn-soft:#2B220F;
  --c-sh:#5B8CFF; --c-bj:#FF5A4E; --c-xa:#F2A93B; --c-cd:#A6E04A; --c-cq:#FF5C9A; --c-sz:#3CCFE0; --c-gz:#A98BFF;
  --glow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-weight:400}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:4px}
.zh{font-family:var(--f-display)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.3em}
.brand span{color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.status{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:var(--glow)}

main{max-width:640px;margin:0 auto;padding-inline:20px;padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
section[role=tabpanel]{display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 -8px;font-weight:400;display:flex;gap:10px;align-items:baseline}
h2 .zh{font-size:13px;letter-spacing:.2em;color:var(--ink)}

/* Bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:10px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);position:relative}
.tab::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:transparent;transition:background .2s}
.tab .zh{font-size:17px;line-height:1.25;font-weight:400;letter-spacing:.1em}
.tab small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]::before{background:var(--accent);box-shadow:var(--glow)}

/* Hero (was: ticket) */
.ticket{background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.ticket-main{padding:20px 20px 18px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:start}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big-zh{display:flex;gap:4px;margin-top:14px}
.flapch{font-family:var(--f-display);font-weight:300;font-size:clamp(54px,17vw,80px);line-height:1;width:1.12em;height:1.3em;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;color:var(--accent);text-shadow:var(--glow);position:relative;overflow:hidden;background:var(--faint)}
.flapch::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.flapch.spin{color:var(--muted)}
#flap,.stamp{cursor:pointer;-webkit-tap-highlight-color:transparent}
.big-py{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.stamp{border:1.5px solid var(--accent);border-radius:3px;color:var(--accent);padding:6px 5px;display:flex;align-items:center;justify-content:center;transform:rotate(-4deg);line-height:1}
.stamp .zh{writing-mode:vertical-rl;font-size:17px;font-weight:700;letter-spacing:.12em;display:block}
.stamp small{display:none}
.perf{height:0;border-top:1px dashed var(--line);margin:0 20px}
.ticket-foot{padding:14px 20px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 16px}
.kv .k{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.kv .v{font-weight:500;font-size:14px;overflow-wrap:anywhere;margin-top:2px}

/* Route */
.route{padding:4px 0 0}
.route ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);position:relative}
.route ol::before{content:"";position:absolute;left:7.14%;right:7.14%;top:6px;height:1px;background:var(--line)}
.route .fill{position:absolute;left:7.14%;top:6px;height:1px;width:0;background:var(--accent);box-shadow:var(--glow);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.route li{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;min-width:0}
.route .dot{width:13px;height:13px;border-radius:50%;background:var(--paper);border:1px solid var(--muted);position:relative;transition:background .2s,border-color .2s,box-shadow .2s}
.route li.past .dot{background:var(--cc);border-color:var(--cc)}
.route li.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--stamp-soft),var(--glow)}
.route.pending li .dot{background:var(--paper)!important;border-color:var(--muted)!important;box-shadow:none!important}
.route .zh{font-size:15px;font-weight:400;letter-spacing:.06em}
.route li.now .zh{color:var(--accent)}
.route small{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);white-space:nowrap;letter-spacing:.04em}

/* Day list */
.days{border-top:1px solid var(--line)}
.day{display:grid;grid-template-columns:58px 3px 1fr auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.day .d{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);line-height:1.3;text-transform:uppercase;letter-spacing:.06em}
.day .d b{display:block;font-size:14px;color:var(--ink);font-weight:500;letter-spacing:0;text-transform:none}
.day .bar{align-self:stretch;width:3px;border-radius:2px;background:var(--cc);opacity:.85}
.day .what{min-width:0}
.day .what b{font-weight:500}
.day .what span{display:block;font-size:12.5px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.move{border-color:color-mix(in srgb,var(--cc) 50%,var(--line));color:var(--cc)}
.day.past{opacity:.45}
.day.today{background:var(--stamp-soft);border-radius:4px}
.day.today .tag{background:var(--accent);border-color:var(--accent);color:var(--card)}

.sim{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sim input{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-family:var(--f-mono);text-transform:none}
.btn{background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-size:13px;font-weight:500}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Stays */
.summary{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.summary div{padding:14px 0;display:flex;flex-direction:column;gap:2px}
.summary div+div{border-left:1px solid var(--line);padding-left:14px}
.summary b{font-family:var(--f-mono);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.summary span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stay{--cc:var(--muted)}
.stay .ticket-main{grid-template-columns:auto 1fr;align-items:center}
.stay .city-zh{font-family:var(--f-display);font-weight:300;font-size:30px;color:var(--cc);line-height:1;writing-mode:vertical-rl;letter-spacing:.1em}
.stay h3{margin:4px 0 0;font-size:15.5px;font-weight:500;line-height:1.35;text-wrap:balance}
.stay .when{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--muted)}
.stay.current{border-color:var(--accent);box-shadow:var(--glow)}
.links{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 18px}
.links a{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:6px 10px;border-radius:4px}
.copy{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;font-family:var(--f-mono);font-size:12.5px;font-weight:400;text-decoration:underline dotted;text-underline-offset:3px;color:inherit}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--accent);padding:2px 0 2px 12px}
.note b{color:var(--ink);font-weight:500}

/* Plan */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pday{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;scroll-margin-top:72px}
.pday header{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pday header .zh{font-size:24px;font-weight:300;color:var(--cc);line-height:1;letter-spacing:.06em}
.pday header div{flex:1;min-width:0}
.pday header b{display:block;font-size:15px;font-weight:500}
.pday header span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pday.today{border-color:var(--accent);box-shadow:var(--glow)}
.pday.past{opacity:.55}
.pday ul{list-style:none;margin:0;padding:6px 0}
.pday li label{display:grid;grid-template-columns:20px 1fr;gap:12px;padding:8px 16px;align-items:start;cursor:pointer}
.pday li input{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:3px 0 0;border:1px solid var(--muted);border-radius:3px;display:grid;place-items:center;background:transparent}
.pday li input::after{content:"";width:8px;height:4px;border-left:1.5px solid var(--card);border-bottom:1.5px solid var(--card);transform:translateY(-1px) rotate(-45deg);opacity:0}
.pday li input:checked{background:var(--ok);border-color:var(--ok)}
.pday li input:checked::after{opacity:1}
.pday li .txt{display:block;background-image:linear-gradient(var(--ok),var(--ok));background-repeat:no-repeat;background-position:0 58%;background-size:0% 1.5px;transition:background-size .4s ease-out,color .2s}
.pday li input:checked + span .txt{background-size:100% 1.5px;color:var(--muted)}
.pday .transit{margin:0 16px 12px;font-family:var(--f-mono);font-size:11.5px;padding:8px 0 0;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted)}
.pday .tip{margin:0 16px 14px;font-size:13px;padding:2px 0 2px 12px;border-left:2px solid var(--accent);color:var(--ink)}
.pday .tip b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:400;margin-right:4px}
.badge{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.badge.confirmed{background:var(--ok-soft);color:var(--ok)}
.badge.tobook{background:var(--warn-soft);color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:5px}

/* Dictionary */
.search{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px;font-size:16px}
.search:focus{outline:none;border-bottom-color:var(--accent)}
.cat{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.cat h3{margin:0;padding:14px 0 6px;font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.cat h3 .zh{font-size:14px;letter-spacing:.2em;color:var(--ink);text-transform:none}
.ph{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--faint);align-items:center}
.cat h3 + .ph{border-top:0}
.ph .en{font-size:12.5px;color:var(--muted);grid-column:1}
.ph .hz{font-family:var(--f-display);font-size:22px;font-weight:400;line-height:1.35;grid-column:1;letter-spacing:.04em}
.ph .py{font-family:var(--f-mono);font-size:13px;grid-column:1;color:var(--accent)}
.ph .acts{grid-column:2;grid-row:1 / span 3;display:flex;flex-direction:column;gap:6px}
.ico{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;color:var(--ink)}
.ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--muted);padding:24px}

/* Show-to-someone overlay */
.show{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 20px;text-align:center}
.show .hz{font-family:var(--f-display);font-weight:500;font-size:clamp(44px,13vw,96px);line-height:1.25;text-wrap:balance;letter-spacing:.04em}
.show .py{font-family:var(--f-mono);font-size:18px;color:var(--accent)}
.show .en{font-size:15px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;z-index:30}



/* Photo strips in Plan */
.gallery:empty{display:none}
.gallery{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.g-head{display:flex;align-items:baseline;gap:10px}
.g-head .zh{font-size:22px;font-weight:300;color:var(--cc);letter-spacing:.08em}
.g-head .mono{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.g-strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding:0 20px 2px;scroll-padding-inline:20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.g-strip::-webkit-scrollbar{display:none}
.g-item{flex:none;width:min(80vw,360px);margin:0;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.g-item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--faint);border:1px solid var(--line);display:block;opacity:0;transition:opacity .5s ease}
.g-item img.in{opacity:1}
.g-item figcaption{display:flex;flex-direction:column;gap:1px;min-width:0}
.g-item figcaption b{font-weight:500;font-size:14px}
.g-item figcaption a{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.g-item img{transition:none;opacity:1}}

/* Journey board */
.board{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topbar,45px));z-index:4;background:var(--paper);margin:-20px -20px 0;padding:16px 20px 14px;border-bottom:1px solid var(--line)}
.board-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.b-idx{font-size:11px;color:var(--muted);letter-spacing:.08em}
.board-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px}
.board .big-zh{margin-top:0}
.board .big-py{margin-top:10px}
.board .route{margin-top:16px;padding:0}
.railbtn{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:inherit;width:100%}
.route li.view .dot{border-color:var(--accent);border-width:2px;transform:scale(1.2)}
.route li.view .zh{color:var(--accent)}
.stops{display:flex;flex-direction:column;padding-bottom:30vh}
.stop{min-height:62vh;padding:32px 0 8px;display:flex;flex-direction:column;gap:12px}
.stop-head{display:flex;align-items:baseline;gap:12px}
.stop-head .n{font-size:11px;color:var(--muted);letter-spacing:.08em}
.stop-head .zh{font-size:32px;font-weight:300;color:var(--cc);letter-spacing:.08em;line-height:1}
.stop-head b{font-weight:500;font-size:16px}
.stop-meta{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stop-hotel{font-size:14px;display:flex;flex-direction:column;gap:2px}
.stop-hotel .mono{font-size:11px;color:var(--muted)}
.stop.done .stop-head .zh{opacity:.55}
.leg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:10px}
.leg .arrow{color:var(--cc);font-size:14px}
@media (prefers-reduced-motion:no-preference){
  .day.today,.pday.today{animation:pulse 1.6s ease-out 1}
  @keyframes pulse{from{box-shadow:0 0 0 6px var(--stamp-soft)}}
  .stamp.thump{animation:thump .5s cubic-bezier(.3,1.6,.5,1) .9s both}
  .stamp.thump.now{animation-delay:0s}
  @keyframes thump{0%{transform:rotate(-20deg) scale(1.9);opacity:0}60%{opacity:1}100%{transform:rotate(-4deg) scale(1)}}
  section[role=tabpanel].enter{animation:glide .18s ease-out}
  @keyframes glide{from{opacity:0;transform:translateX(8px)}}
}
@media (prefers-reduced-motion:reduce){.route .fill{transition:none}.pday li .txt{transition:none}}
@media (max-width:380px){.summary b{font-size:18px}.day{grid-template-columns:52px 3px 1fr auto;gap:10px}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b class="zh">中国</b><span>Oct 11 → Nov 4</span></div>
    <span class="status" id="status">…</span>
  </div>
</header>

const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return (h>>>0).toString(36)};

/* ===================== END TRIP DATA ===================== */

const DAY=86400000;
const toUTC=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const keyOf=t=>new Date(t).toISOString().slice(0,10);
const localToday=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`};
const fmt=(s,o)=>new Date(toUTC(s)).toLocaleDateString('en-US',Object.assign({timeZone:'UTC'},o));
const short=s=>fmt(s,{month:'short',day:'numeric'});
const START='2026-10-11',END='2026-11-04';

const DAYS=[];
for(let t=toUTC(START);t<=toUTC(END);t+=DAY){
  const k=keyOf(t);
  const si=STAYS.findIndex(s=>k>=s.in&&k<s.out);
  const arriving=STAYS.findIndex(s=>s.in===k);
  let kind='stay',c=si>=0?STAYS[si].c:STAYS[STAYS.length-1].c,from=null;
  if(k===START)kind='arrive';
  else if(k===END)kind='depart';
  else if(arriving>0){kind='move';from=STAYS[arriving-1].c}
  DAYS.push({k,c,si,kind,from});
}

let sim=null;
const today=()=>sim||localToday();

function phase(){
  const t=today();
  if(t<START)return{when:'before',n:Math.round((toUTC(START)-toUTC(t))/DAY)};
  if(t>END)return{when:'after'};
  const idx=DAYS.findIndex(d=>d.k===t);
  return{when:'during',idx,day:DAYS[idx]};
}

function setStatus(){
  const p=phase(),s=$('#status');
  s.textContent=p.when==='before'?`Starts in ${p.n} day${p.n===1?'':'s'}`:p.when==='after'?'Trip complete':`Day ${p.idx+1} of ${DAYS.length}`;
}
/* Status for the city in view on the Itinerary: counts to its check-in, or says where you are */
function setStatusFor(i){
  const s=STAYS[i], t=today(), name=CITIES[s.c].en, el=$('#status');
  const days=Math.round((toUTC(s.in)-toUTC(t))/DAY);
  if(t>=s.in&&t<s.out||(t===s.out&&s.out===END)){const p=phase();el.textContent=`Here now · day ${p.idx+1} of ${DAYS.length}`}
  else if(days>0)el.textContent=days===1?`${name} tomorrow`:`${name} in ${days} days`;
  else el.textContent=`${name} · visited`;
}

/* ---------- Motion ---------- */
const REDUCED=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
const FLAP_GLYPHS='上海北京西安成都重庆深圳广州东南中华城站';
const FLIP_TICKS=4, FLIP_STAGGER=2; // flips per tile; second tile settles a bit later
function flip(delay){
  const tiles=[...document.querySelectorAll('#flap .flapch')];
  tiles.forEach((el,k)=>{
    if(el._flip)clearInterval(el._flip);
    const target=el.dataset.ch||(el.dataset.ch=el.textContent); let n=0;
    setTimeout(()=>{
      el.classList.add('spin');
      el._flip=setInterval(()=>{
        const done=++n>FLIP_TICKS+k*FLIP_STAGGER;
        el.textContent=done?target:FLAP_GLYPHS[Math.floor(Math.random()*FLAP_GLYPHS.length)];
        try{el.animate([{transform:'scaleY(.1)'},{transform:'scaleY(1)'}],{duration:70,easing:'ease-out'})}catch(e){}
        if(done){clearInterval(el._flip);el._flip=null;el.classList.remove('spin')}
      },80);
    },delay);
  });
}
function thump(){const el=document.querySelector('.stamp');if(!el||REDUCED)return;el.classList.remove('thump','now');void el.offsetWidth;el.classList.add('thump','now')}
const fontsReady=(document.fonts&&document.fonts.ready)?document.fonts.ready.catch(()=>{}):Promise.resolve();
function applyCityAccent(){
  const p=phase();
  const c=p.when==='before'?STAYS[0].c:p.when==='after'?STAYS[STAYS.length-1].c:p.day.c;
  document.documentElement.style.setProperty('--accent',`var(--c-${c})`);
}

/* ---------- Itinerary: scroll journey ----------
   A sticky departure board sits on top. Each city is a section below it.
   As a section reaches the board, the board flips to that city and the accent follows.
   The seal shows (and stamps) only while the board is on today's city. */
let viewIdx=-1, curIdx=-1, journeyScrolled=false;
const stopOf=d=>d.si>=0?d.si:STAYS.length-1;
const range=s=>`${short(s.in)} → ${short(s.out)}`;
const nightsOf=s=>(toUTC(s.out)-toUTC(s.in))/DAY;

function renderItinerary(){
  const p=phase(), t=today();
  curIdx=p.when==='during'?stopOf(p.day):-1;
  const startIdx=curIdx>=0?curIdx:p.when==='after'?STAYS.length-1:0;
  const prog=p.when==='before'?0:p.when==='after'?1:curIdx/(STAYS.length-1);

  const rail=STAYS.map((s,i)=>{
    const cls=(p.when==='after'||i<curIdx)?'past':i===curIdx?'now':'';
    return `<li class="${cls}" style="--cc:var(--c-${s.c})"><button class="railbtn" data-go="${i}" aria-label="Go to ${CITIES[s.c].en}"><span class="dot"></span><span class="zh">${CITIES[s.c].zh}</span></button></li>`;
  }).join('');

  const stops=STAYS.map((s,i)=>{
    const c=CITIES[s.c], n=nightsOf(s);
    const days=DAYS.filter(d=>stopOf(d)===i).map(d=>{
      const isT=d.k===t, past=d.k<t;
      let what=`<b>${esc(PLAN[d.k]?PLAN[d.k].t:c.en)}</b>`, tag='';
      if(d.kind==='arrive')tag='<span class="tag move">Arrive</span>';
      else if(d.kind==='move')tag='<span class="tag move">Train</span>';
      else if(d.kind==='depart')tag='<span class="tag move">Depart</span>';
      if(isT)tag='<span class="tag">Today</span>';
      const nc=PLAN[d.k]?PLAN[d.k].i.map(norm).filter(x=>x.status==='confirmed').length:0;
      return `<div class="day${isT?' today':''}${past?' past':''}" style="--cc:var(--c-${d.c})">
        <div class="d mono">${fmt(d.k,{weekday:'short'})}<b>${fmt(d.k,{month:'short',day:'numeric'})}</b></div>
        <span class="bar"></span>
        <div class="what">${what}<span>Day ${DAYS.indexOf(d)+1}${nc?` · ${nc} confirmed`:''}</span></div>${tag}</div>`;
    }).join('');
    const bookedToday=(i===curIdx&&PLAN[t])?PLAN[t].i.map(norm).filter(x=>x.status):[];
    const next=STAYS[i+1], leg=next?TRANSIT[next.in]:TRANSIT[END];
    return `<section class="stop${i===curIdx?' current':''}${(p.when==='after'||i<curIdx)?' done':''}" data-i="${i}" id="stop-${s.c}" style="--cc:var(--c-${s.c})">
      <div class="stop-head"><span class="n mono">${String(i+1).padStart(2,'0')}</span><span class="zh">${c.zh}</span><b>${c.en}</b></div>
      <div class="stop-meta mono">${range(s)} · ${n} night${n>1?'s':''}</div>
      <div class="stop-hotel">${esc(s.name.split(' (')[0])}<span class="mono">${esc(s.room)}</span></div>
      ${bookedToday.length?`<div class="note"><b>Bookings today</b>${bookedToday.map(x=>`<div style="margin-top:6px">${esc(x.text)}${meta(x)}</div>`).join('')}</div>`:''}
      <div class="days">${days}</div>
      ${leg?`<div class="leg"><span class="arrow" aria-hidden="true">↓</span><span>${esc(leg.text)}</span>${badge(leg.status)}</div>`:''}
    </section>`;
  }).join('');

  $('#p-itinerary').innerHTML=`
    <div class="board" id="board">
      <div class="board-top"><span class="eyebrow" id="b-label"></span><span class="mono b-idx" id="b-idx"></span></div>
      <div class="board-row">
        <div class="big-zh" id="flap"><span class="flapch"></span><span class="flapch"></span></div>
        <div class="stamp" id="seal" hidden><span class="zh">今天</span></div>
      </div>
      <div class="big-py" id="b-py"></div>
      <div class="route"><ol><span class="fill" id="rfill"></span>${rail}</ol></div>
    </div>
    <div class="stops">${stops}</div>
    <div class="sim"><label for="simdate">Preview a date</label><input type="date" id="simdate" min="2026-10-01" max="2026-11-10" value="${sim||''}"><button class="btn" id="simreset">Use real today</button></div>`;

  /* initial board state, no animation */
  const tiles=[...document.querySelectorAll('#flap .flapch')];
  const sc=CITIES[STAYS[startIdx].c];
  tiles.forEach((el,k)=>{el.textContent=el.dataset.ch=[...sc.zh][k]||''});
  viewIdx=-1; setView(startIdx,false);
  if(!REDUCED)fontsReady.then(()=>{flip(300);if(startIdx===curIdx)setTimeout(thump,1250)});

  const fill=$('#rfill');fill.style.transition='none';fill.style.width='0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{fill.style.transition='';fill.style.width=(85.72*prog)+'%'}));

  $('#flap').onclick=()=>{if(!REDUCED)flip(0)};
  $('#seal').onclick=thump;
  document.querySelectorAll('.railbtn').forEach(b=>b.onclick=()=>scrollToStop(+b.dataset.go,true));
  $('#simdate').onchange=e=>{sim=e.target.value||null;journeyScrolled=false;renderAll();scrollToStop(curIdx>=0?curIdx:0,false)};
  $('#simreset').onclick=()=>{sim=null;journeyScrolled=false;renderAll();scrollToStop(curIdx>=0?curIdx:0,false)};
}

function setView(i,animate){
  if(i===viewIdx||i<0)return;
  viewIdx=i;
  const s=STAYS[i], c=CITIES[s.c], n=nightsOf(s), p=phase();
  document.documentElement.style.setProperty('--accent',`var(--c-${s.c})`);
  let label=`${range(s)} · ${n} nights`;
  if(i===curIdx&&p.day.kind!=='depart'){const k=(toUTC(p.day.k)-toUTC(s.in))/DAY+1;label=`Today · night ${k} of ${n}`}
  else if(i===curIdx)label='Today · departure';
  $('#b-label').textContent=label;
  setStatusFor(i);
  $('#b-idx').textContent=`${String(i+1).padStart(2,'0')} / ${String(STAYS.length).padStart(2,'0')}`;
  $('#b-py').textContent=`${c.py} · ${c.en}`;
  $('#flap').setAttribute('aria-label',c.zh);
  document.querySelectorAll('.route li').forEach((li,k)=>li.classList.toggle('view',k===i));
  [...document.querySelectorAll('#flap .flapch')].forEach((el,k)=>{el.dataset.ch=[...c.zh][k]||''});
  if(animate&&!REDUCED)flip(0);
  else document.querySelectorAll('#flap .flapch').forEach(el=>{if(!el._flip)el.textContent=el.dataset.ch});
  const seal=$('#seal'), isCur=i===curIdx;
  seal.hidden=!isCur;
  if(isCur&&animate)thump();
}

function stopUnderBoard(){
  const board=$('#board'); if(!board)return -1;
  const line=board.getBoundingClientRect().bottom+Math.min(140,innerHeight*.18);
  let idx=0;
  document.querySelectorAll('.stop').forEach(sec=>{if(sec.getBoundingClientRect().top<=line)idx=+sec.dataset.i});
  return idx;
}
let ticking=false;
window.addEventListener('scroll',()=>{
  if(ticking||$('#p-itinerary').hidden)return; ticking=true;
  requestAnimationFrame(()=>{ticking=false;setView(stopUnderBoard(),true)});
},{passive:true});

function scrollToStop(i,smooth){
  const sec=document.querySelector(`.stop[data-i="${i}"]`); if(!sec)return;
  if(i===0){window.scrollTo({top:0,behavior:smooth&&!REDUCED?'smooth':'auto'});return}
  const board=$('#board'), top=$('.top');
  const offset=(top?top.offsetHeight:0)+(board?board.offsetHeight:0)+8;

/* ---------- Plan ---------- */
let planFilter=store.get('cn-plan-filter','all');
function renderPlan(){
  const done=store.get('cn-plan-done',{});
  const t=today();
  const chips=['all',...STAYS.map(s=>s.c)].map(c=>`<button class="chip" data-f="${c}" aria-pressed="${planFilter===c}">${c==='all'?'All days':CITIES[c].en}</button>`).join('');
  let lastCity=null;
  const cards=DAYS.filter(d=>planFilter==='all'||d.c===planFilter||(d.from&&d.from===planFilter)).map((d,i)=>{
    const gal=d.c!==lastCity?`<div class="gallery" data-city="${d.c}" style="--cc:var(--c-${d.c})"></div>`:'';
    lastCity=d.c;
    const p=PLAN[d.k]||{t:'',i:[]};const c=CITIES[d.c];
    const n=DAYS.indexOf(d)+1;
    const items=p.i.map(norm).map(it=>{const id=`${d.k}-${hash(it.text)}`;return `<li><label><input type="checkbox" id="pc-${id}" data-id="${id}" ${done[id]?'checked':''}><span><span class="txt">${esc(it.text)}</span>${meta(it)}</span></label></li>`}).join('');
    return gal+`<article class="pday${d.k===t?' today':''}${d.k<t?' past':''}" style="--cc:var(--c-${d.c})" id="day-${d.k}">
      <header><span class="zh">${c.zh}</span><div><b>${esc(p.t)}</b><span>Day ${n} · ${fmt(d.k,{weekday:'long',month:'short',day:'numeric'})}</span></div>${d.k===t?'<span class="tag" style="background:var(--stamp);border-color:var(--stamp);color:var(--card)">Today</span>':''}</header>
      <ul>${items}</ul>
      ${TRANSIT[d.k]&&d.kind!=='arrive'?`<div class="transit"><span>${esc(TRANSIT[d.k].text)}</span>${badge(TRANSIT[d.k].status)}</div>`:''}
      ${p.tip?`<div class="tip"><b>Tip</b> ${esc(p.tip)}</div>`:''}
    </article>`;
  }).join('');
  $('#p-plan').innerHTML=`<div class="chips" role="group" aria-label="Filter by city">${chips}</div>${cards}`;
  fillGalleries();
  $('#p-plan').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{planFilter=b.dataset.f;store.set('cn-plan-filter',planFilter);renderPlan()});
  $('#p-plan').querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{const d=store.get('cn-plan-done',{});if(cb.checked)d[cb.dataset.id]=1;else delete d[cb.dataset.id];store.set('cn-plan-done',d)});
}

/* Mandarin voice: pick a real mainland zh-CN voice instead of the browser default.
   Cantonese (zh-HK) and Taiwanese Mandarin (zh-TW) voices are skipped on purpose. */
let ZH_VOICE=null;
const VOICE_PREF=[/xiaoxiao/i,/yunxi/i,/tingting|ting-ting/i,/普通话|mandarin.*(china|mainland)/i,/google.*(普通话|chinese)/i,/yaoyao|huihui|kangkang/i,/lili|meijia|sinji/i];
function pickVoice(){
  let vs=[];try{vs=speechSynthesis.getVoices()}catch(e){return null}
  const norm=v=>(v.lang||'').replace('_','-').toLowerCase();
  const cn=vs.filter(v=>norm(v)==='zh-cn'||norm(v)==='cmn-cn'||norm(v)==='cmn-hans-cn');
  const pool=cn.length?cn:vs.filter(v=>/^zh(-hans)?$/.test(norm(v)));
  const score=v=>{let s=0;VOICE_PREF.forEach((re,i)=>{if(re.test(v.name))s=Math.max(s,100-i*10)});if(/enhanced|premium|neural|natural|online/i.test(v.name))s+=15;if(v.localService)s+=3;return s};
  ZH_VOICE=pool.sort((a,b)=>score(b)-score(a))[0]||null;
  const lbl=document.getElementById('voice-name');
  if(lbl)lbl.textContent=ZH_VOICE?`Voice: ${ZH_VOICE.name} (${ZH_VOICE.lang})`:'No Mandarin voice found on this device';
  return ZH_VOICE;
}
try{pickVoice();speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}
/* Make the text read naturally: separators become pauses, Latin bits are dropped */
const speakable=t=>t.replace(/\s*[\/·]\s*/g,'，').replace(/WiFi/gi,'无线网').trim().replace(/\s+/g,'，');
function say(t){
  try{
    const v=ZH_VOICE||pickVoice();
    if(!v){toast('Add a Chinese (China mainland) voice in your device settings');return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(speakable(t));
    u.voice=v;u.lang=v.lang;u.rate=.82;u.pitch=1;
    setTimeout(()=>speechSynthesis.speak(u),60); // iOS drops a speak() called right after cancel()
  }catch(e){toast('Audio is not available here')}
}
let showing=null;
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-say]');if(s){say(s.dataset.say);return}
  const sh=e.target.closest('[data-show]');
  if(sh){showing=JSON.parse(decodeURIComponent(sh.dataset.show));$('#show-en').textContent=showing[0];$('#show-hz').textContent=showing[1];$('#show-py').textContent=showing[2];$('#show').hidden=false;return}
  const cp=e.target.closest('[data-copy]');
  if(cp){e.preventDefault();const v=cp.dataset.copy;try{navigator.clipboard.writeText(v).then(()=>toast('Booking number copied'),()=>selectText(cp))}catch(err){selectText(cp)}}
});
function selectText(el){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected, copy it from the menu')}catch(e){}}
$('#show-close').onclick=()=>{$('#show').hidden=true};
$('#show-say').onclick=()=>showing&&say(showing[3]||showing[1]);
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#show').hidden=true});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

/* ---------- Tabs ---------- */
const TABS=['itinerary','stays','plan','dictionary'];
function go(tab,scroll){
  if(!TABS.includes(tab))tab='itinerary';
  const prev=store.get('cn-tab',null);
  TABS.forEach(t=>{$('#p-'+t).hidden=t!==tab;$('#t-'+t).setAttribute('aria-selected',t===tab)});
  if(scroll&&prev!==tab){const el=$('#p-'+tab);el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter')}
  store.set('cn-tab',tab);
  window.scrollTo(0,0);
  if(scroll&&tab==='plan'){const el=document.getElementById('day-'+today());if(el)el.scrollIntoView({block:'start'})}
  if(tab==='itinerary'){
    if(viewIdx>=0)document.documentElement.style.setProperty('--accent',`var(--c-${STAYS[viewIdx].c})`);
    if(!journeyScrolled&&curIdx>0){journeyScrolled=true;requestAnimationFrame(()=>scrollToStop(curIdx,false))}
  }else{applyCityAccent();setStatus()}
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.tab,true));

function setTopbar(){const t=$('.top');if(t)document.documentElement.style.setProperty('--topbar',t.offsetHeight+'px')}
setTopbar();window.addEventListener('resize',setTopbar);
function renderAll(){applyCityAccent();setStatus();renderItinerary();renderStays();renderPlan();if(!$('#p-itinerary').hidden&&viewIdx>=0)document.documentElement.style.setProperty('--accent',`var(--c-${STAYS[viewIdx].c})`)}
renderAll();initDict();
const h=(location.hash||'').slice(1);
go(TABS.includes(h)?h:store.get('cn-tab','itinerary'),false);

/* Re-check the date when the app comes back to the foreground (e.g. next morning) */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sim)renderAll()});

/* Offline support when installed from its own host (ignored inside the claude.ai viewer) */
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{})}}catch(e){}
})();
